<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chef's studio</title>
    <link rel="stylesheet" href="Aiindex.css" />
    <link rel="stylesheet" href="responsive.css" />
  </head>

  <body>
    <div class="wrap">
      <!-- 상단 -->
      <header>
        <div class="inner">
          <!-- 로고 -->
          <h1><a href="#">Chef's studio</a></h1>

          <!-- 네비게이션 -->
          <nav class="nav" aria-label="메인 메뉴">
            <!-- 메뉴 링크 -->
            <div class="menu" id="main-menu">
              <a href="#">쿠킹 클래스</a>
              <a href="#">소개</a>
              <a href="#">로그인</a>
            </div>

            <!-- 검색 버튼 -->
            <a href="#" class="search-btn" aria-label="검색">
              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              >
                <circle cx="10.5" cy="10.5" r="6.5" />
                <line x1="15.5" y1="15.5" x2="21" y2="21" />
              </svg>
            </a>

            <!-- 햄버거 버튼 -->
            <button
              type="button"
              class="menu-btn"
              aria-label="메뉴 열기"
              aria-controls="main-menu"
              aria-expanded="false"
            >
              <svg
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2.5"
                stroke-linecap="round"
              >
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
          </nav>
        </div>
      </header>

      <!-- 메인 -->
      <main></main>
    </div>

    <!-- 메뉴 열기/닫기 -->
    <script>
      const nav = document.querySelector(".nav");
      const menuBtn = document.querySelector(".menu-btn");

      menuBtn.addEventListener("click", () => {
        const isOpen = nav.classList.toggle("open");

        menuBtn.setAttribute("aria-expanded", isOpen);
        menuBtn.setAttribute("aria-label", isOpen ? "메뉴 닫기" : "메뉴 열기");
      });
    </script>
  </body>
</html>
